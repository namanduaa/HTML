<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      padding: 2rem;
    }

    .card h1 {
      margin-top: 0;
      color: #1d4ed8;
      font-size: 1.8rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
      color: #555;
    }

    .field input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
    }

    .field input:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.4rem;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
      margin-top: 0.5rem;
    }

    .button:hover {
      background: #1e40af;
    }

    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      background: #eef2ff;
      color: #1e293b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Student Details</h1>
    <div class="field">
      <label for="student-name">Name</label>
      <input id="student-name" type="text" placeholder="Enter your name" />
    </div>
    <div class="field">
      <label for="student-class">Class</label>
      <input id="student-class" type="text" placeholder="Enter your class" />
    </div>
    <div class="field">
      <label for="student-roll">Roll No.</label>
      <input id="student-roll" type="text" placeholder="Enter your roll number" />
    </div>
    <button class="button" id="show-details">Show Details</button>
    <div class="result" id="result">
      Enter your details and click "Show Details".
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('student-name');
    const classInput = document.getElementById('student-class');
    const rollInput = document.getElementById('student-roll');
    const showButton = document.getElementById('show-details');
    const resultDiv = document.getElementById('result');

    showButton.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const studentClass = classInput.value.trim();
      const roll = rollInput.value.trim();

      if (!name || !studentClass || !roll) {
        resultDiv.textContent = 'Please complete all fields before showing details.';
        return;
      }

      resultDiv.innerHTML = `
        <strong>Name:</strong> ${name}<br />
        <strong>Class:</strong> ${studentClass}<br />
        <strong>Roll No.:</strong> ${roll}
      `;
    });
  </script>
</body>
</html>
